name: Validate PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  DNSCONTROL_VERSION: "5.10.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted validator code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head without checking out PR code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests & typecheck on validator
        run: |
          npm test
          npm run typecheck

      - name: Validate PR changes & generate DNS diff summary
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          npm run validate -- \
            --base "$BASE_SHA" \
            --head "refs/remotes/origin/pr-${PR_NUMBER}" \
            --author "$PR_AUTHOR" \
            --emit-manifest dist/dns-manifest.json \
            --markdown > /tmp/pr-comment.md
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/pr-comment.md

      - name: Install DNSControl & run offline config check
        if: steps.validate.outputs.exit_code == '0'
        run: |
          TARBALL="dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/DNSControl/dnscontrol/releases/download/v${DNSCONTROL_VERSION}"
          curl -fsSLO "${BASE_URL}/${TARBALL}"
          curl -fsSLO "${BASE_URL}/checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" dnscontrol
          chmod +x dnscontrol
          printf '{"none":{"TYPE":"NONE"},"cloudflare":{"TYPE":"CLOUDFLAREAPI","apitoken":"check-only"}}\n' > /tmp/creds.check.json
          ./dnscontrol check --creds /tmp/creds.check.json
          rm -f "${TARBALL}" checksums.txt dnscontrol /tmp/creds.check.json

      - name: Comment DNS preview on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- fdomain-dns-preview -->";
            const body = fs.existsSync("/tmp/pr-comment.md")
              ? fs.readFileSync("/tmp/pr-comment.md", "utf8")
              : `${marker}\nValidation did not finish cleanly. Check the workflow logs.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce validation result
        if: steps.validate.outputs.exit_code != '0' || steps.validate.outputs.ok != 'true'
        run: exit 1

      - name: Auto-merge trusted contributor PR
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          steps.validate.outputs.ok == 'true' &&
          steps.validate.outputs.auto_merge_eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: "squash",
              });
              // GITHUB_TOKEN merges do not trigger on:push workflows; dispatch explicitly
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "deploy-dns.yml",
                ref: "main",
              });
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "deploy-site.yml",
                ref: "main",
              });
            } catch (err) {
              core.warning(`Auto-merge skipped or blocked by repo rules: ${err.message}`);
            }
